upstream travel_app {
    server app:8001;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location /webhook {
        proxy_pass         http://travel_app;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   Connection "";
        proxy_read_timeout 30s;
    }

    location /api {
        proxy_pass         http://travel_app;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   Connection "";
    }

    location /health {
        proxy_pass http://travel_app;
        access_log off;
    }

    location /docs {
        proxy_pass http://travel_app;
    }

    location / {
        return 404;
    }
}
