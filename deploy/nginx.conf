# =============================================================================
# /etc/nginx/sites-available/bot.grip2peak.com
#
# Travel-Agent bot — subdomain approach (рекомендуется).
# Не трогает существующий сайт grip2peak.com.
#
# Установка:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/bot.grip2peak.com
#   sudo ln -sf /etc/nginx/sites-available/bot.grip2peak.com \
#               /etc/nginx/sites-enabled/bot.grip2peak.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Затем получи SSL:
#   sudo certbot --nginx -d bot.grip2peak.com --agree-tos -m your@email.com
# =============================================================================

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name bot.grip2peak.com;

    # ACME challenge для certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS — основной блок ─────────────────────────────────────────────────────
# (certbot заполнит cert-пути автоматически; до запуска certbot этот блок
#  можно закомментировать, чтобы nginx стартовал только на HTTP)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bot.grip2peak.com;

    # Certbot добавит эти строки автоматически, или укажи вручную:
    ssl_certificate     /etc/letsencrypt/live/bot.grip2peak.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.grip2peak.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    # Логи только для бота (не мешают логам основного сайта)
    access_log /var/log/nginx/travel-bot.access.log;
    error_log  /var/log/nginx/travel-bot.error.log warn;

    # ── Telegram Webhook ──────────────────────────────────────────────────────
    # SECRET_KEY берётся из .env → путь /webhook/{SECRET_KEY}
    location /webhook {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
    }

    # ── Health check (для мониторинга / GitHub Actions) ───────────────────────
    location /health {
        proxy_pass      http://127.0.0.1:8001;
        proxy_set_header Host $host;
        access_log      off;
    }

    # ── API / Docs (только для development — в production можно убрать) ───────
    location /docs {
        # В production FastAPI отключает /docs. Оставляем на случай debug.
        proxy_pass http://127.0.0.1:8001;
    }

    # ── Всё остальное закрыто ─────────────────────────────────────────────────
    location / {
        return 444;  # silent drop
    }
}


# =============================================================================
# АЛЬТЕРНАТИВА: path-prefix на существующем домене grip2peak.com
#
# Если не хочешь отдельный поддомен — добавь этот location-блок внутрь
# существующего server{} для grip2peak.com (в файл sites-available/grip2peak.com):
#
#   location /travel-bot/ {
#       proxy_pass         http://127.0.0.1:8001/;
#       proxy_http_version 1.1;
#       proxy_set_header   Host              $host;
#       proxy_set_header   X-Real-IP         $remote_addr;
#       proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
#       proxy_set_header   X-Forwarded-Proto $scheme;
#       proxy_read_timeout 30s;
#   }
#
#   location /travel-bot/webhook {
#       proxy_pass http://127.0.0.1:8001/webhook;
#       ...
#   }
#
# При этом изменить в .env:
#   WEBHOOK_URL=https://grip2peak.com/travel-bot
# =============================================================================
